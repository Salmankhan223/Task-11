<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="product.css">
</head>
<style>
    .right-shopping{
       margin-right: 10%;
       width: 30%;
    }
</style>
<body>
    <main class="payment">
        <div class="payment-left">
           <p class="check">Checkout</p>
           <h2>Contact Details</h2>
           <div class="email">
            <label for="email">Email ID</label>
            <input type="email" name="email" id="email" placeholder="John Doe">
           </div>

           <h3>Payment</h3>

           <div class="payment-container">
               <div class="payment-methods">
                <button class="card">Card</button>
                <button class="crypto">Crypto</button>
                <button class="bank">Bank</button>
                <button>⁞</button>
               </div>
            
               <label for="number">Card Number</label>
               <input type="number" name="number" id="number" placeholder="*******" class="cardnumber">

               <div class="card-details">
                <div>
                    <label for="date">Expiry</label>
                    <input type="number" id="date" name="date" placeholder="MM/YY">
                </div>
                    <div>
                    <label for="cvc">CVC</label>
                    <input type="number" id="cvc" name="cvc" placeholder="***">
                </div>
                    <div>
                    <label for="county">Country</label>
                    <input type="text" id="country" name="country" placeholder="India">
                </div>
                <div>
                    <label for="zip">ZIP</label>
                    <input type="text" id="zip" name="zip" placeholder="XXXXXX">
                </div>
               </div>
           </div>
        </div>
           <div class="right-shopping">
            <h1>Order Summary</h1>
                    <div class="price-container">

                        <h4>Enter Cuopon Code</h4>
                        <div class="coupon">
                            <input type="text" name="" id="" placeholder="COUPON CODE">
                            <a href="#">Apply Coupon</a>
                        </div>

                        <div class="price-total">
                            <p>Sub Total</p>
                            <p>₹4700</p>
                        </div>
                        <div class="price-total">
                            <p>Taxes(If applicable)</p>
                            <p>₹199</p>
                        </div>
                        <div class="price-total">
                            <p>Discount</p>
                            <p>₹0</p>
                        </div>
                        <div class="total">
                            <p>Total</p>
                            <p>₹4,999</p>
                        </div>
                    </div>

                  <a class="pay-button" href="">Pay Now ₹4,999</a>
                  <img src="images/rajorpay.png" alt="">
                </div>
    </main>
</body>
</html>
